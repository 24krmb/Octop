interface:
  display_name: "繁微Fiona 仓单库存与交割压力分析"
  short_description: "结合仓单、库存、临月持仓与交割期限研判交割压力和风险"
  default_prompt: "Use $fiona-warehouse-delivery-pressure to analyze warehouse-receipt adequacy, inventory pressure, and delivery risk for a futures product."

dependencies:
  tools:
    - type: "mcp"
      value: "futures_market_data"
      description: "Fiona futures contracts, quotes, open interest, member positions, and warehouse-receipt data"
      transport: "streamable_http"
      url: "https://track.finoview.com.cn/fiona/mcp/futures_market_data"
    - type: "mcp"
      value: "dzlabel"
      description: "Fiona commodity fundamental indicator discovery and inventory time series"
      transport: "streamable_http"
      url: "https://track.finoview.com.cn/fiona/mcp/dzlabel"

policy:
  allow_implicit_invocation: true
